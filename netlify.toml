[build]
  command = "python3 scripts/build.py"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "http://www.heshamorabi.com/*"
  to = "https://heshamorabi.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://heshamorabi.com/*"
  to = "https://heshamorabi.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.heshamorabi.com/*"
  to = "https://heshamorabi.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/index.html"
  to = "/privacy/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "browsing-topics=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'none'; media-src 'none'; worker-src 'none'; script-src 'self' 'sha256-LQsmuEQBunanDTKnPPyVGB6ddVbP1WozGKPchSxRO9A=' https://*.googletagmanager.com; script-src-attr 'none'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self'; style-src-attr 'none'; font-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

